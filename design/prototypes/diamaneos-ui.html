<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DiamaneOS / Facet — Interface study</title>
  <style>html{color-scheme:light dark}body{margin:0;padding:16px;background:light-dark(#fff,#111411)}</style>
  <script src="assets/lucide-1.8.0.min.js"></script>
</head>
<body>
<!-- FACET-STUDY-START -->
<div id="diamaneos-facet" aria-label="DiamaneOS interface concept">
  <style>
    #diamaneos-facet{--dm-bg:light-dark(#f4f5ef,#171a17);--dm-paper:light-dark(#fff,#252925);--dm-soft:light-dark(#e7eae0,#30372e);--dm-text:light-dark(#21271f,#f0f3e9);--dm-muted:light-dark(#545f50,#b5c0ae);--dm-line:light-dark(#d6dbcf,#404a3c);--dm-accent:light-dark(#d5ed69,#d5ed69);--dm-onaccent:light-dark(#25320b,#25320b);--dm-tonal:light-dark(#e8f0cb,#354022);--dm-error:light-dark(#9f3228,#ffb4a8);--dm-errorsurface:light-dark(#fbe6e1,#402722);--dm-scale:1;--dm-inset:24px;--dm-duration:200ms;--dm-ease:cubic-bezier(.2,.8,.2,1);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;color:var(--dm-text);width:100%;padding:8px 0 18px;box-sizing:border-box}
    #diamaneos-facet *{box-sizing:border-box}
    #diamaneos-facet button,#diamaneos-facet input,#diamaneos-facet select{font:inherit}
    #diamaneos-facet button{cursor:pointer;color:inherit;border:0;background:none;touch-action:manipulation}
    #diamaneos-facet button:disabled{cursor:default;opacity:.55}
    #diamaneos-facet button:active:not(:disabled){transform:scale(.98)}
    #diamaneos-facet button{transition:background-color 140ms,transform 90ms var(--dm-ease)}
    #diamaneos-facet .dm-meta{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;max-width:580px;margin:0 auto 16px;font-size:12px;color:var(--dm-muted);padding:0 4px}
    #diamaneos-facet .dm-brand{font-size:16px;font-weight:500;color:var(--dm-text);letter-spacing:-.5px}
    #diamaneos-facet .dm-gallery{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;max-width:600px;margin:0 auto 16px}
    #diamaneos-facet .dm-gallery button{min-height:48px;border-radius:12px;padding:8px 12px;font-size:13px;color:var(--dm-muted)}
    #diamaneos-facet .dm-gallery button[aria-pressed=true]{color:var(--dm-text);background:var(--dm-soft);font-weight:500}
    #diamaneos-facet .dm-phone{position:relative;isolation:isolate;max-width:390px;width:100%;margin:auto;min-height:750px;border-radius:34px;background:var(--dm-bg);color:var(--dm-text);border:1px solid var(--dm-line);box-shadow:0 16px 40px light-dark(#28302014,#00000025);display:flex;flex-direction:column;overflow:clip;font-size:calc(16px * var(--dm-scale))}
    #diamaneos-facet .dm-status{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--dm-inset) 8px;width:100%;font-size:12px;font-weight:500;min-height:48px;direction:ltr;touch-action:pan-x}
    #diamaneos-facet .dm-status span:last-child{display:flex;align-items:center;gap:6px}
    #diamaneos-facet .dm-status svg{width:14px;height:14px}
    #diamaneos-facet .dm-screen,#diamaneos-facet .dm-motion-snapshot{background:var(--dm-bg);padding:8px var(--dm-inset) 16px;flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
    #diamaneos-facet .dm-motion-snapshot{position:absolute;pointer-events:none;z-index:3}
    #diamaneos-facet .dm-preview-theme{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;max-width:580px;margin:0 auto 12px;font-size:13px;color:var(--dm-muted)}
    #diamaneos-facet .dm-preview-theme[hidden]{display:none}
    #diamaneos-facet .dm-preview-theme select{min-height:48px;max-width:100%;padding:8px 12px;border:1px solid var(--dm-line);border-radius:12px;background:var(--dm-paper);color:var(--dm-text)}
    #diamaneos-facet .dm-homeclock,#diamaneos-facet .dm-home-swipe,#diamaneos-facet .dm-drawer-handle,#diamaneos-facet .dm-shadehead{touch-action:pan-x}
    #diamaneos-facet .dm-homeclock,#diamaneos-facet .dm-home-swipe{user-select:none}
    #diamaneos-facet .dm-drawer-handle{display:flex;align-items:center;justify-content:center;min-height:48px;margin:0 -12px 8px}
    #diamaneos-facet .dm-drawer-handle button{touch-action:pan-x}
    #diamaneos-facet .dm-drawer-handle span{width:32px;height:4px;border-radius:4px;background:var(--dm-line)}
    #diamaneos-facet .dm-toolbar{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:8px;min-height:48px;margin:0 -12px 16px}
    #diamaneos-facet .dm-toolbar .dm-small{font-weight:500;text-align:center;overflow-wrap:anywhere;min-width:0}
    #diamaneos-facet .dm-iconbutton{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:16px;flex-shrink:0}
    #diamaneos-facet .dm-iconbutton:hover{background:var(--dm-soft)}
    #diamaneos-facet .dm-homecontext{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px;margin-bottom:16px}
    #diamaneos-facet .dm-affordance{display:flex;justify-content:center;align-items:center;align-self:center;min-width:80px;min-height:48px;padding:0 16px;border-radius:16px;touch-action:pan-x}
    #diamaneos-facet .dm-shadehead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
    #diamaneos-facet .dm-shadehead h1{font-size:calc(28px * var(--dm-scale));letter-spacing:-.8px;margin:0;min-width:0}
    #diamaneos-facet .dm-screen[data-page=notifications]{background:var(--dm-bg)}
    #diamaneos-facet svg{width:20px;height:20px;stroke-width:1.7;flex-shrink:0}
    #diamaneos-facet h1,#diamaneos-facet h2,#diamaneos-facet h3,#diamaneos-facet p{margin:0;font-weight:400}
    #diamaneos-facet h1{font-size:calc(40px * var(--dm-scale));line-height:1.08;letter-spacing:-1.7px;margin-bottom:12px;overflow-wrap:anywhere}
    #diamaneos-facet h2{font-size:calc(28px * var(--dm-scale));line-height:1.15;letter-spacing:-.8px;margin-bottom:12px;overflow-wrap:anywhere}
    #diamaneos-facet h3{font-size:calc(20px * var(--dm-scale));line-height:1.25;letter-spacing:-.3px;overflow-wrap:anywhere}
    #diamaneos-facet .dm-small{font-size:calc(12px * var(--dm-scale));color:var(--dm-muted);line-height:1.4}
    #diamaneos-facet .dm-body{font-size:calc(14px * var(--dm-scale));line-height:1.5;color:var(--dm-muted)}
    #diamaneos-facet .dm-body,#diamaneos-facet .dm-small,#diamaneos-facet .dm-kicker{overflow-wrap:anywhere}
    #diamaneos-facet [lang=de]{hyphens:auto}
    #diamaneos-facet .dm-kicker{font-size:calc(12px * var(--dm-scale));line-height:1.4;letter-spacing:1.3px;text-transform:uppercase;color:var(--dm-muted);margin-bottom:12px}
    #diamaneos-facet .dm-spacer{flex:1;min-height:24px}
    #diamaneos-facet .dm-gap{height:24px;flex-shrink:0}
    #diamaneos-facet .dm-section{margin-top:24px;margin-bottom:8px;font-size:calc(12px * var(--dm-scale));color:var(--dm-muted);font-weight:500}
    #diamaneos-facet .dm-primary,#diamaneos-facet .dm-secondary{min-height:52px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:16px;padding:16px;font-weight:500;width:100%;text-align:start;font-size:calc(14px * var(--dm-scale));overflow-wrap:anywhere}
    #diamaneos-facet .dm-primary{background:var(--dm-accent);color:var(--dm-onaccent)}
    #diamaneos-facet .dm-secondary{background:var(--dm-soft);color:var(--dm-text)}
    #diamaneos-facet .dm-primary>span,#diamaneos-facet .dm-secondary>span,#diamaneos-facet .dm-textbutton>span{min-width:0}
    #diamaneos-facet .dm-textbutton{font-size:calc(14px * var(--dm-scale));font-weight:500;text-align:start;min-width:48px;min-height:48px;padding:12px 0;display:flex;align-items:center;gap:12px;overflow-wrap:anywhere}
    #diamaneos-facet .dm-screen>p+.dm-primary{margin-top:8px}
    #diamaneos-facet .dm-group+.dm-secondary,#diamaneos-facet .dm-group+.dm-primary{margin-top:8px}
    #diamaneos-facet .dm-sheet>p+button{margin-top:16px}
    #diamaneos-facet .dm-actions{display:grid;gap:8px;margin-top:16px}
    #diamaneos-facet .dm-group{border-radius:24px;background:var(--dm-paper);padding:4px 16px;margin-top:8px}
    #diamaneos-facet .dm-row{display:flex;align-items:center;gap:12px;padding:16px 0;min-height:64px;width:100%;text-align:start;border-bottom:1px solid var(--dm-line)}
    #diamaneos-facet .dm-row:last-child{border-bottom:0}
    #diamaneos-facet .dm-rowcopy{min-width:0;flex:1;overflow-wrap:anywhere}
    #diamaneos-facet .dm-rowcopy>span{display:block}
    #diamaneos-facet .dm-label{font-size:calc(14px * var(--dm-scale));font-weight:500}
    #diamaneos-facet .dm-tileicon{display:flex;align-items:center;justify-content:center;background:var(--dm-soft);border-radius:16px;width:40px;height:40px;flex-shrink:0}
    #diamaneos-facet .dm-hero{background:var(--dm-accent);color:var(--dm-onaccent);border-radius:24px;padding:24px;position:relative;margin-top:8px}
    #diamaneos-facet .dm-hero .dm-small,#diamaneos-facet .dm-hero .dm-body,#diamaneos-facet .dm-hero .dm-kicker{color:var(--dm-onaccent)}
    #diamaneos-facet .dm-big{font-size:calc(88px * var(--dm-scale));line-height:1;letter-spacing:-6px;font-weight:400;overflow-wrap:anywhere}
    #diamaneos-facet .dm-big small{font-size:.4em;letter-spacing:-1px}
    #diamaneos-facet .dm-homeclock{padding:24px 0;position:relative}
    #diamaneos-facet .dm-homeclock .dm-big{font-size:calc(88px * var(--dm-scale));letter-spacing:-5px;position:relative;z-index:1;direction:ltr;text-align:start}
    #diamaneos-facet .dm-homeclock:before{content:"";position:absolute;width:146px;height:146px;background:light-dark(var(--dm-accent),color-mix(in srgb,var(--dm-accent) 25%,var(--dm-bg)));border-radius:50% 50% 12% 50%;inset-inline-end:0;top:12px;transform:rotate(-24deg);z-index:0}
    #diamaneos-facet .dm-homeclock p{position:relative;z-index:1;margin-top:12px;color:var(--dm-text)}
    #diamaneos-facet .dm-homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
    #diamaneos-facet .dm-hometile{background:var(--dm-paper);border-radius:24px;padding:16px;min-height:132px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;min-width:0;overflow-wrap:anywhere}
    #diamaneos-facet .dm-hometile:first-child{background:var(--dm-tonal)}
    #diamaneos-facet .dm-hometile .dm-label{margin-top:auto}
    #diamaneos-facet .dm-appgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 8px;margin:16px 0}
    #diamaneos-facet .dm-app{display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0;text-align:center;padding:0;font-size:calc(12px * var(--dm-scale));overflow-wrap:anywhere}
    #diamaneos-facet .dm-appmark{background:var(--dm-paper);width:56px;height:56px;border-radius:18px;display:flex;justify-content:center;align-items:center}
    #diamaneos-facet .dm-appmark svg{width:24px;height:24px}
    #diamaneos-facet .dm-appmark.dm-colored{background:var(--dm-accent);color:var(--dm-onaccent)}
    #diamaneos-facet .dm-search{display:flex;align-items:center;gap:12px;background:var(--dm-paper);border:1px solid var(--dm-line);border-radius:16px;min-height:56px;padding:12px 16px;width:100%;text-align:start;font-size:calc(14px * var(--dm-scale));color:var(--dm-muted)}
    #diamaneos-facet label.dm-search{padding-block:4px}
    #diamaneos-facet .dm-search input{border:0;min-width:0;min-height:48px;flex:1;background:transparent;color:var(--dm-text);font-size:calc(16px * var(--dm-scale));padding:0;width:100%}
    #diamaneos-facet .dm-search input::-webkit-search-cancel-button{display:none}
    #diamaneos-facet .dm-search input::placeholder{color:var(--dm-muted)}
    #diamaneos-facet .dm-search .dm-iconbutton{min-width:48px;min-height:48px;margin:-8px 0;margin-inline-end:-8px}
    #diamaneos-facet .dm-nav{display:flex;justify-content:center;align-items:center;min-height:48px;padding:0 16px 8px}
    #diamaneos-facet .dm-homebutton{min-width:120px;min-height:48px;display:flex;align-items:center;justify-content:center}
    #diamaneos-facet .dm-homebutton:before{content:"";height:5px;width:100px;border-radius:5px;background:var(--dm-text)}
    #diamaneos-facet .dm-notice{background:var(--dm-tonal);border-radius:24px;padding:16px;margin:16px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
    #diamaneos-facet .dm-notice.dm-error{background:var(--dm-errorsurface);color:var(--dm-error)}
    #diamaneos-facet .dm-notice.dm-error .dm-body{color:var(--dm-error)}
    #diamaneos-facet .dm-pill{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px * var(--dm-scale));font-weight:500;min-height:28px}
    #diamaneos-facet .dm-pill svg{width:16px;height:16px}
    #diamaneos-facet .dm-words{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;direction:ltr}
    #diamaneos-facet .dm-word{display:flex;gap:12px;align-items:center;background:var(--dm-paper);padding:16px;border-radius:16px;font-size:calc(16px * var(--dm-scale));overflow-wrap:anywhere;min-width:0}
    #diamaneos-facet .dm-word span{color:var(--dm-muted);font-size:calc(12px * var(--dm-scale))}
    #diamaneos-facet .dm-choices{display:grid;gap:8px;margin-top:16px}
    #diamaneos-facet .dm-choices button{border:1px solid var(--dm-line);border-radius:16px;padding:14px 16px;min-height:52px;text-align:start}
    #diamaneos-facet .dm-choices button[aria-pressed=true]{background:var(--dm-tonal);border-color:var(--dm-muted)}
    #diamaneos-facet .dm-toggle{width:42px;height:26px;border-radius:20px;background:var(--dm-soft);display:flex;align-items:center;padding:3px;flex-shrink:0}
    #diamaneos-facet .dm-toggle:after{content:"";width:20px;height:20px;border-radius:50%;background:var(--dm-muted)}
    #diamaneos-facet [aria-checked=true] .dm-toggle{background:var(--dm-accent);justify-content:flex-end}
    #diamaneos-facet [aria-checked=true] .dm-toggle:after{background:var(--dm-onaccent)}
    #diamaneos-facet .dm-quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    #diamaneos-facet .dm-quick{padding:16px;border-radius:24px;background:var(--dm-soft);display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;min-height:100px;min-width:0;overflow-wrap:anywhere}
    #diamaneos-facet .dm-quick[aria-pressed=true]{background:var(--dm-accent);color:var(--dm-onaccent)}
    #diamaneos-facet .dm-quick[aria-pressed=true] .dm-small{color:var(--dm-onaccent)}
    #diamaneos-facet .dm-slider{width:100%;accent-color:var(--dm-text);min-height:48px;margin:8px 0;direction:ltr;cursor:pointer}
    #diamaneos-facet .dm-rangeends{display:flex;justify-content:space-between;gap:12px;direction:ltr;font-size:calc(12px * var(--dm-scale));color:var(--dm-muted)}
    #diamaneos-facet .dm-rule{height:1px;background:var(--dm-line);margin:16px 0}
    #diamaneos-facet .dm-meter{display:flex;gap:4px;direction:ltr;margin:24px 0 12px}
    #diamaneos-facet .dm-meter span{height:28px;border-radius:4px;flex:1;background:color-mix(in srgb,var(--dm-onaccent) 15%,transparent)}
    #diamaneos-facet .dm-meter span[data-filled=true]{background:var(--dm-onaccent)}
    #diamaneos-facet .dm-progress{height:6px;background:var(--dm-soft);border-radius:8px;margin:16px 0}
    #diamaneos-facet .dm-progress span{display:block;height:100%;background:var(--dm-text);border-radius:8px;transition:width var(--dm-duration) var(--dm-ease)}
    #diamaneos-facet .dm-stage{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:calc(14px * var(--dm-scale))}
    #diamaneos-facet .dm-stage span:first-child{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--dm-soft);border-radius:50%;flex-shrink:0;font-size:12px}
    #diamaneos-facet .dm-stage[data-done=true] span:first-child{background:var(--dm-accent);color:var(--dm-onaccent)}
    #diamaneos-facet .dm-scrim{position:absolute;inset:0;background:light-dark(#18201355,#00000077);z-index:8;display:flex;align-items:flex-end}
    #diamaneos-facet .dm-sheet{width:100%;background:var(--dm-paper);padding:16px var(--dm-inset) 24px;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px light-dark(#18201314,#00000030)}
    #diamaneos-facet .dm-sheethead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
    #diamaneos-facet .dm-sheethead h2{margin:8px 0;min-width:0}
    #diamaneos-facet .dm-sheethead .dm-iconbutton{margin-inline-end:-12px}
    #diamaneos-facet .dm-sheet .dm-group{background:var(--dm-bg)}
    #diamaneos-facet .dm-atlas{background:light-dark(#f0e6dc,#332c27);border-radius:24px;padding:24px;color:light-dark(#4b392c,#ecd9ca);margin:12px 0}
    #diamaneos-facet .dm-atlas h2{font-family:Georgia,serif}
    #diamaneos-facet .dm-atlas .dm-routeart{height:112px;border:1px dashed currentColor;border-radius:50% 20% 50% 30%;margin:28px 20px 24px;transform:rotate(-12deg);opacity:.6}
    #diamaneos-facet .dm-filepreview{background:var(--dm-paper);border-radius:24px;padding:24px;margin:16px 0;display:grid;gap:16px;min-height:240px}
    #diamaneos-facet .dm-fileline{height:6px;background:var(--dm-line);border-radius:4px}
    #diamaneos-facet .dm-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    #diamaneos-facet[data-character=quiet] .dm-homeclock:before{width:76px;height:76px;top:32px;inset-inline-end:0}
    #diamaneos-facet[data-character=quiet] .dm-homeclock .dm-big{font-size:calc(80px * var(--dm-scale));letter-spacing:-5px}
    #diamaneos-facet[data-character=quiet] .dm-hero{background:var(--dm-tonal);color:var(--dm-text)}
    #diamaneos-facet[data-character=quiet] .dm-hero .dm-small,#diamaneos-facet[data-character=quiet] .dm-hero .dm-body,#diamaneos-facet[data-character=quiet] .dm-hero .dm-kicker{color:var(--dm-muted)}
    #diamaneos-facet[data-character=quiet] .dm-hero .dm-meter span[data-filled=true]{background:var(--dm-text)}
    #diamaneos-facet[data-large=true] .dm-homegrid,#diamaneos-facet[data-large=true] .dm-words,#diamaneos-facet[data-large=true] .dm-quickgrid{grid-template-columns:1fr}
    #diamaneos-facet[data-large=true] h1{font-size:calc(28px * var(--dm-scale))}
    #diamaneos-facet[data-large=true] h2{font-size:calc(24px * var(--dm-scale))}
    #diamaneos-facet[data-large=true] .dm-appgrid{grid-template-columns:1fr}
    #diamaneos-facet[data-large=true] .dm-app{flex-direction:row;text-align:start;gap:16px}
    #diamaneos-facet[data-large=true] .dm-homeclock .dm-big{display:flex;flex-direction:column}
    #diamaneos-facet[data-large=true] .dm-clockseparator{display:none}
    #diamaneos-facet[data-large=true] .dm-shadehead{flex-wrap:wrap}
    #diamaneos-facet[data-large=true] .dm-shadehead h1{flex-basis:100%}
    #diamaneos-facet[data-large=true] .dm-shadehead .dm-iconbutton{margin-inline-start:auto}
    #diamaneos-facet[data-large=true] .dm-homeclock .dm-big,#diamaneos-facet[data-large=true] .dm-big{font-size:calc(64px * var(--dm-scale));letter-spacing:-3px}
    #diamaneos-facet [dir=rtl] .dm-back svg,#diamaneos-facet [dir=rtl] [data-lucide=arrow-right],#diamaneos-facet [dir=rtl] [data-lucide=chevron-right]{transform:scaleX(-1)}
    #diamaneos-facet[data-reduced=true] *,#diamaneos-facet[data-reduced=true] *:before{transition:none!important;animation:none!important}
    #diamaneos-facet[data-reduced=true] button:active{transform:none}
    @media(prefers-reduced-motion:reduce){#diamaneos-facet *,#diamaneos-facet *:before{transition:none!important;animation:none!important}#diamaneos-facet button:active{transform:none}}
    @media(max-width:360px){#diamaneos-facet{--dm-inset:16px}#diamaneos-facet .dm-phone{border-radius:24px}#diamaneos-facet .dm-gallery button{padding-inline:8px}}
  </style>

    <button type="button" class="dm-status" data-action="shade-toggle" aria-label="Open notifications" aria-expanded="false"><span>09:41</span><span><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i>76%<i data-lucide="battery-medium" aria-hidden="true"></i></span></button>

  <script>
  (()=>{
    const root=document.getElementById('diamaneos-facet');
    const screen=root.querySelector('.dm-screen'),phone=root.querySelector('.dm-phone'),gallery=root.querySelector('.dm-gallery'),overlay=root.querySelector('.dm-overlay'),live=root.querySelector('.dm-live');
    const design={character:'expressive',palette:'citrine',appearance:'system',reduced:false,text:100,locale:'en',scenario:'normal'};
    const de={'Open notifications':'Mitteilungen öffnen','Close notifications':'Mitteilungen schließen',Home:'Start',Setup:'Einrichtung',Privacy:'Datenschutz',Notifications:'Mitteilungen',Battery:'Akku',Updates:'Updates',Back:'Zurück',Close:'Schließen',Files:'Dateien',Settings:'Einstellungen',Search:'Suchen','All apps':'Alle Apps','Apps and settings':'Apps und Einstellungen','Thursday, 10 September':'Donnerstag, 10. September','Your space.':'Dein Freiraum.','Recent downloads':'Letzte Downloads','Make it yours':'Ganz nach deinem Geschmack','Personal profile':'Persönliches Profil','Search apps and settings':'Apps und Einstellungen suchen','No results':'Keine Ergebnisse','Try another name, or open Files or Settings.':'Versuche einen anderen Namen oder öffne Dateien oder Einstellungen.','Search unavailable':'Suche nicht verfügbar','You can still open your apps directly.':'Du kannst deine Apps weiterhin direkt öffnen.',Retry:'Erneut versuchen',Continue:'Weiter','Start setup':'Einrichtung beginnen','Welcome to your phone.':'Willkommen auf deinem Smartphone.','A few essentials. Then it’s yours.':'Ein paar wichtige Schritte. Dann gehört es dir.','No account needed':'Kein Konto erforderlich','Set your passphrase':'Passphrase einrichten','Six words. One key.':'Sechs Wörter. Ein Schlüssel.','Review sample words':'Beispielwörter ansehen','Hide words':'Wörter ausblenden','Practice remembering':'Erinnern üben','Which was the third word?':'Wie lautete das dritte Wort?','Try again':'Noch einmal versuchen','Review words again':'Wörter erneut ansehen','Your phone is ready.':'Dein Smartphone ist bereit.','Go to Home':'Zum Startbildschirm','Couldn’t prepare your passphrase':'Deine Passphrase konnte nicht vorbereitet werden','Nothing has been set. Try again.':'Es wurde nichts eingerichtet. Versuche es erneut.','Preparing setup…':'Einrichtung wird vorbereitet…','App privacy':'App-Datenschutz','Change preset':'Voreinstellung ändern',Untrusted:'Nicht vertrauenswürdig',Standard:'Standard',Trusted:'Vertrauenswürdig',Custom:'Benutzerdefiniert','Preview changes':'Änderungen prüfen','Apply changes':'Änderungen anwenden',Network:'Netzwerk',Sensors:'Sensoren',Storage:'Speicher',Contacts:'Kontakte',Allowed:'Erlaubt',Blocked:'Blockiert','Selected files only':'Nur ausgewählte Dateien','Selected contacts only':'Nur ausgewählte Kontakte','No change':'Unverändert','Changes applied':'Änderungen übernommen','Some changes weren’t applied':'Einige Änderungen wurden nicht übernommen','Open individual controls':'Einzelne Einstellungen öffnen','Current state unavailable':'Aktueller Zustand nicht verfügbar','Reading permissions…':'Berechtigungen werden gelesen…','Quick settings':'Schnelleinstellungen',Connected:'Verbunden',Off:'Aus',On:'An',Brightness:'Helligkeit','Notification settings':'Benachrichtigungseinstellungen','Why are notifications missing?':'Warum fehlen Benachrichtigungen?','Notifications are off':'Benachrichtigungen sind ausgeschaltet','Turn on notifications':'Benachrichtigungen einschalten','Send a test notification':'Testbenachrichtigung senden','Notification received':'Benachrichtigung empfangen','Work profile is stopped':'Das Arbeitsprofil ist beendet','Open profile settings':'Profileinstellungen öffnen','Return to Personal':'Zum persönlichen Profil zurückkehren','Couldn’t check notification settings':'Benachrichtigungseinstellungen konnten nicht geprüft werden','Checking notifications…':'Benachrichtigungen werden geprüft…','Charge limit':'Ladegrenze','Apply limit':'Ladegrenze übernehmen','Charging':'Wird geladen','Until tomorrow.':'Bis morgen.','Battery health':'Akkuzustand','Health and history':'Zustand und Verlauf','Charge limit unavailable':'Ladegrenze nicht verfügbar','Couldn’t change the limit':'Die Ladegrenze konnte nicht geändert werden','Battery care':'Akkupflege','Reading battery…':'Akku wird gelesen…','Unavailable':'Nicht verfügbar','Export history':'Verlauf exportieren','Save copy':'Kopie speichern','Export complete':'Export abgeschlossen','Ready when you are.':'Bereit, wenn du es bist.','Download update':'Update herunterladen','Update details':'Update-Details','Downloading':'Wird heruntergeladen','Verifying':'Wird geprüft','Installing':'Wird installiert','Restart to finish':'Zum Abschließen neu starten','Restart now':'Jetzt neu starten','Later':'Später','Update complete':'Update abgeschlossen','Couldn’t verify this update':'Dieses Update konnte nicht geprüft werden','Try download again':'Download erneut versuchen','Check connection':'Verbindung prüfen','No connection':'Keine Verbindung','Checking for updates…':'Updates werden gesucht…',Done:'Fertig','Open Downloads':'Downloads öffnen','Allow while using the app':'Während der Nutzung der App erlauben','Don’t allow':'Nicht erlauben','Use approximate location':'Ungefähren Standort verwenden','Location precision':'Standortgenauigkeit',Approximate:'Ungefähr','Close all apps':'Alle Apps schließen'};
    const t=s=>design.locale==='de'?(de[s]||s):s;
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
    const b=(label,action,cls='dm-primary',end='')=>`<button type="button" class="${cls}" data-action="${action}"><span>${esc(t(label))}</span>${end?icon(end):''}</button>`;
    const small=s=>`<p class="dm-small">${esc(t(s))}</p>`;
    const body=s=>`<p class="dm-body">${esc(t(s))}</p>`;
    const title=(s,k='')=>`${k?`<div class="dm-kicker">${esc(t(k))}</div>`:''}<h1>${esc(t(s))}</h1>`;
    const row=(name,value,action='',ico='')=>`<${action?'button type="button"':'div'} class="dm-row" ${action?`data-action="${action}"`:''}>${ico?`<span class="dm-tileicon">${icon(ico)}</span>`:''}<span class="dm-rowcopy"><span class="dm-label">${esc(t(name))}</span><span class="dm-small">${esc(t(value))}</span></span>${action?icon('chevron-right'):''}</${action?'button':'div'}>`;
    const notice=(name,copy,error=false)=>`<div class="dm-notice${error?' dm-error':''}" ${error?'role="alert"':''}>${icon(error?'circle-alert':'info')}<h3>${esc(t(name))}</h3>${body(copy)}</div>`;
    const toolbar=(name,action='back')=>`<div class="dm-toolbar"><button type="button" class="dm-iconbutton dm-back" data-action="${action}" aria-label="${esc(t('Back'))}">${icon('arrow-left')}</button><span class="dm-small">${esc(t(name))}</span><span aria-hidden="true"></span></div>`;
    const group=inner=>`<div class="dm-group">${inner}</div>`;
    const journeys=[['home','Home'],['setup','Setup'],['privacy','Privacy'],['notifications','Notifications'],['battery','Battery'],['updates','Updates']];
    let page='home',journey='home',stack=[],sheet='',sheetFocus='',fault='normal',timer=0,motion=null;
    let phraseShown=false,phraseReviewed=false,practiceError=false,query='',preset='Standard',candidate='Untrusted',privacyApplied=false,partial=false,failedCapability='Network';
    let permissions={network:true,sensors:false},wanted=80,effective=80,batteryFailed=false,limitApplied=false,notificationOn=false,notificationTest=false;
    let wifi=true,bluetooth=false,bright=65,update='available',progress=0,atlasLocation=false,openedFile='itinerary',previousScenario='normal',chatReplied=false;
    function announce(s){live.textContent=t(s)}
    function icons(){if(globalThis.lucide)lucide.createIcons({root,attrs:{width:20,height:20}});if(design.locale==='de'){const translated=new Set(Object.values(de));const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())if(translated.has(walker.currentNode.textContent.trim())&&walker.currentNode.parentElement.lang!=='de')nodes.push(walker.currentNode);for(const node of nodes){const span=document.createElement('span');span.lang='de';node.replaceWith(span);span.append(node)}}}
    function isReduced(){return design.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches}
    function resetScenario(){clearTimeout(timer);fault=design.scenario;stack=[];sheet='';page=journey;phraseShown=false;phraseReviewed=false;practiceError=false;privacyApplied=false;partial=false;permissions={network:true,sensors:false};preset='Standard';candidate='Untrusted';wanted=80;effective=80;batteryFailed=false;limitApplied=false;notificationOn=false;notificationTest=false;update='available';progress=0;query='';wifi=true;bluetooth=false;bright=65;atlasLocation=false;chatReplied=false;openedFile='itinerary';failedCapability='Network';render()}
    function routeMotion(from,to,back=false){
      if(to===from)return '';
      if(from==='notifications')return 'shade-out';
      if(to==='notifications')return 'shade-in';
      if(from==='apps'&&to==='home')return 'drawer-out';
      if(from==='home'&&to==='apps')return 'drawer-in';
      if(from==='search'&&to==='home')return 'search-out';
      if(from==='home'&&to==='search')return 'search-in';
      return back?'back':'forward';
    }
    function navigate(to,remember=true){const from=page;const focus=sheet?sheetFocus:(document.activeElement?.dataset?.action||'');if(remember)stack.push({page,focus,journey});page=to;if(journeys.some(([id])=>id===to))journey=to;sheet='';render(routeMotion(from,to));announce(pageTitle());focusFirst()}
    function goBack(){if(sheet){closeSheet();return}const from=page,prev=stack.pop();page=prev?.page||'home';journey=prev?.journey||'home';render(routeMotion(from,page,true));announce(pageTitle());if(!prev?.focus||!focusAction(prev.focus))focusFirst()}
    function focusAction(a){
      const target=[...root.querySelectorAll('[data-action]')].find(el=>el.dataset.action===a&&!el.closest('[inert]')&&!el.disabled);
      target?.focus({preventScroll:true});return !!target;
    }
    function focusFirst(){screen.querySelector(page==='search'?'#dm-query':'input,button:not(:disabled)')?.focus({preventScroll:true})}
    function openSheet(name){cancelMotion();sheetFocus=document.activeElement?.dataset?.action||'';sheet=name;renderSheet();overlay.querySelector('button')?.focus({preventScroll:true})}
    function closeSheet(){cancelMotion();sheet='';renderSheet();if(!focusAction(sheetFocus))focusFirst()}
    function pageTitle(){return ({home:'Home',search:'Search',files:'Files',file:'Files',settings:'Settings',apps:'All apps',atlas:'Atlas',meadow:'Meadow',chat:'Maya',setup:'Setup',review:'Set your passphrase',practice:'Set your passphrase',setupDone:'Setup',privacy:'App privacy',privacyPreview:'Preview changes',notifications:'Notifications',diagnosis:'Notification settings',profile:'Work profile',battery:'Battery',health:'Battery health',updates:'Updates'})[page]||page}
    function loading(label){return `${toolbar(pageTitle())}<div class="dm-spacer"></div>${icon('ellipsis')}<div class="dm-gap"></div><h2>${esc(t(label))}</h2>${body('You can leave this screen and come back.')}<div class="dm-spacer"></div>${b('Go to Home','home','dm-secondary')}`}
    function home(){return `<div class="dm-homecontext">${small('Personal profile')}</div><div class="dm-homeclock"><div class="dm-big" role="img" aria-label="09:41"><span aria-hidden="true">09</span><span class="dm-clockseparator" aria-hidden="true">:</span><span aria-hidden="true">41</span></div><p class="dm-body">${esc(t('Thursday, 10 September'))}</p></div><div class="dm-homegrid"><button type="button" class="dm-hometile" data-action="go:files">${icon('folder-down')}<span class="dm-label">${esc(t('Files'))}</span><span class="dm-small">${esc(t('Recent downloads'))}</span></button><button type="button" class="dm-hometile" data-action="go:settings">${icon('sliders-horizontal')}<span class="dm-label">${esc(t('Settings'))}</span><span class="dm-small">${esc(t('Make it yours'))}</span></button></div><div class="dm-spacer dm-home-swipe"></div><div class="dm-appgrid">${app('Files','folder','files')}${app('Settings','settings-2','settings')}${app('Meadow','messages-square','meadow')}${app('Atlas','compass','atlas',true)}</div><button type="button" class="dm-affordance" data-action="go:apps" aria-label="${esc(t('All apps'))}">${icon('chevron-up')}</button>`}
    function app(name,ico,to,col=false){return `<button type="button" class="dm-app" data-action="go:${to}"><span class="dm-appmark${col?' dm-colored':''}">${icon(ico)}</span><span>${esc(t(name))}</span></button>`}
    function searchResults(){if(fault==='loading')return body('Searching…');if(fault==='failure'||fault==='unavailable')return notice('Search unavailable','You can still open your apps directly.')+b('Files','go:files','dm-secondary')+b('Settings','go:settings','dm-textbutton');const list=[['Files','Recent downloads','files','folder'],['Settings','Make it yours','settings','settings-2'],['Battery','Charge limit','battery','battery-medium'],['Updates','System update','updates','download'],['Meadow','App','meadow','messages-square'],['Atlas','App','atlas','compass']];let matches=fault==='empty'?[]:list.filter(a=>a.slice(0,2).some(x=>t(x).toLowerCase().includes(query.toLowerCase())));if(!matches.length)return notice('No results','Try another name, or open Files or Settings.')+b('Open Downloads','go:files','dm-secondary');return `<div class="dm-section">${esc(t(query?'Results':'Apps and settings'))} · ${matches.length}</div>`+group(matches.map(a=>row(a[0],a[1],`go:${a[2]}`,a[3])).join(''))}
    function search(){return `${toolbar('Search')}<label class="dm-search">${icon('search')}<input id="dm-query" type="search" aria-label="${esc(t('Search apps and settings'))}" placeholder="${esc(t('Search'))}" value="${esc(query)}" autocomplete="off"><button type="button" class="dm-iconbutton" data-action="clear-search" aria-label="Clear search">${icon('x')}</button></label><div id="dm-results">${searchResults()}</div><div class="dm-spacer"></div>`}
    function files(){return `${toolbar('Files')}${title('Downloads')}${body('On this device')}${group(row('Weekend itinerary.pdf','Today · 184 KB','file:itinerary','file-text')+row('Notes.txt','Yesterday · 2 KB','file:notes','file-text'))}<div class="dm-spacer"></div>${small('Personal profile')}`}
    function file(){return `${toolbar('Files')}${title(openedFile==='notes'?'Notes':'Weekend itinerary')}<div class="dm-filepreview"><div class="dm-kicker">${openedFile==='notes'?'Notes':'Saturday'}</div><h2>${openedFile==='notes'?'Things to bring.':'Take the<br>scenic route.'}</h2>${body(openedFile==='notes'?'Water, a light jacket and a packed lunch.':'Meet at the station · 10:30')}<div class="dm-fileline"></div><div class="dm-fileline" style="width:75%"></div>${body(openedFile==='notes'?'Meet outside the main entrance.':'A short walk. A long lunch.')}</div><div class="dm-spacer"></div>${b('Share','sheet:share','dm-primary','share-2')}`}
    function settings(){return `${toolbar('Personal profile')}${title('Settings')}${group(row('Network & internet','Wi-Fi, mobile network','sheet:network','wifi')+row('App privacy','Permissions and presets','go:privacy','shield')+row('Notifications','What gets your attention','go:diagnosis','bell'))}${group(row('Battery','76% · Charging','go:battery','battery-medium')+row('Updates','A new update is available','go:updates','arrow-down-to-line'))}<div class="dm-spacer"></div>${small('DiamaneOS · Fairphone 6')}`}
    function setup(){if(fault==='loading')return loading('Preparing setup…');if(fault==='failure'||fault==='unavailable'||fault==='empty')return `${toolbar('Setup')}${title('Set your passphrase')}${notice('Couldn’t prepare your passphrase','Nothing has been set. Try again.',true)}<div class="dm-spacer"></div>${b('Retry','setup-retry')}`;return `<div class="dm-homecontext"><span class="dm-small">DiamaneOS</span><span class="dm-small">1 / 3</span></div><div class="dm-spacer"></div>${title('Welcome to your phone.')}<div class="dm-hero">${icon('move-up-right')}<div class="dm-gap"></div><h2>${esc(t('Your space.'))}</h2>${body('A few essentials. Then it’s yours.')}</div><div class="dm-spacer"></div>${small('No account needed')}${b('Start setup','go:review')}${b('Accessibility & language','sheet:accessibility','dm-textbutton','accessibility')}`}
    function review(){return `${toolbar('Setup · 2 / 3')}${title('Six words. One key.')}${body('Use a passphrase to unlock after a restart. Fingerprint unlock is optional later.')}<div class="dm-gap"></div>${phraseShown?`<div class="dm-words" aria-label="Public example words">${['orchard','velvet','river','copper','lantern','meadow'].map((s,i)=>`<div class="dm-word"><span>${i+1}</span>${s}</div>`).join('')}</div>${small('Public example only. Never use these words as your real passphrase.')}${b('Hide words','hide-words','dm-textbutton','eye-off')}`:`<div class="dm-notice">${icon('key-round')}<h3>${esc(t('Set your passphrase'))}</h3>${body('Reveal the example only when you are ready. Words are not read aloud automatically.')}</div>${b('Review sample words','show-words','dm-secondary','eye')}`}<div class="dm-spacer"></div>${body('If you forget your passphrase, we cannot recover it or unlock your data.')}${b('Practice remembering','practice','dm-primary').replace('type="button"',phraseReviewed?'type="button"':'type="button" disabled')}`}
    function practice(){return `${toolbar('Setup · 3 / 3')}${title('Which was the third word?')}${body('A short practice with the public example.')}${practiceError?notice('Try again','Nothing has been set. Review the example and try again.',true):''}<div class="dm-choices">${['copper','river','orchard'].map(w=>b(w,`word:${w}`,'dm-secondary','')).join('')}</div><div class="dm-spacer"></div>${b('Review words again','review-again','dm-textbutton','eye')}`}
    function setupDone(){return `${toolbar('Setup')}${title('Your phone is ready.')}<div class="dm-hero">${icon('check')}<div class="dm-gap"></div><h2>${esc(t('Your space.'))}</h2>${body('Standard privacy defaults selected.')}</div><div class="dm-spacer"></div>${body('This example has not set a device credential.')}${b('Go to Home','home')}`}
    function privacy(){
      if(fault==='loading')return loading('Reading permissions…');
      if(fault==='empty')return toolbar('App privacy')+title('Choose an app')+group(row('Meadow','Personal profile','privacy-select','messages-square'));
      const unknown=fault==='unavailable',state=known=>unknown?'Unavailable':known;
      const failureCopy=failedCapability==='Sensors'?'Sensors are still blocked. Network is allowed. Retry Sensors or open its setting.':'Network is still allowed. Other controls are unchanged. Retry Network or open its setting.';
      return `${toolbar('Personal profile')}${title('Meadow','App privacy')}${small('Social app')}${unknown?notice('Current state unavailable','Open individual settings to inspect this app. No changes have been made.',true):`<div class="dm-hero"><span class="dm-kicker">${esc(t('Privacy preset'))}</span><h2>${esc(t(preset))}</h2>${body(preset==='Untrusted'?'Network blocked. Existing file and contact selections kept.':preset==='Trusted'?'Network and sensors allowed. File and contact selections kept.':preset==='Custom'?'Your individual changes are kept.':'Everyday access, with your file and contact selections kept.')}${b('Change preset','sheet:presets','dm-textbutton','arrow-up-right')}</div>${partial?notice('Some changes weren’t applied',failureCopy,true):privacyApplied?`<div class="dm-pill">${icon('check')}${esc(t('Changes applied'))}</div>`:''}`}${group(row('Network',state(permissions.network?'Allowed':'Blocked'),'sheet:network-permission','globe')+row('Sensors',state(permissions.sensors?'Allowed':'Blocked'),'sheet:sensors-permission','scan')+row('Storage',state('Selected files only'),'sheet:scopes','folder-lock')+row('Contacts',state('Selected contacts only'),'sheet:contacts','contact'))}${partial?b('Retry','retry-privacy','dm-secondary'):''}<div class="dm-spacer"></div>${b('Notification settings','go:diagnosis','dm-textbutton','bell')}`;
    }
    function privacyPreview(){const target=candidate==='Untrusted'?false:true;return `${toolbar('App privacy')}${title('Preview changes')}${body(`Meadow · ${t(candidate)} · ${t('Personal profile')}`)}${group(row('Network',`${t(permissions.network?'Allowed':'Blocked')} → ${t(target?'Allowed':'Blocked')}`)+row('Sensors',candidate==='Trusted'?`${t(permissions.sensors?'Allowed':'Blocked')} → ${t('Allowed')}`:'No change')+row('Storage','No change')+row('Contacts','No change'))}${notice('Your choices stay yours','Existing file and contact selections are kept. This preset does not certify an app as safe.')}<div class="dm-spacer"></div>${b('Apply changes','apply-privacy')}${b('Cancel','back','dm-textbutton','')}`}
    function notifications(){
      const header=`<div class="dm-shadehead">${title('Thursday, 10 September')}<button type="button" class="dm-iconbutton" data-action="go:settings" aria-label="${esc(t('Settings'))}">${icon('settings-2')}</button></div>`;
      const footer=`<div class="dm-spacer"></div><button type="button" class="dm-affordance" data-action="back" aria-label="${esc(t('Close notifications'))}">${icon('chevron-up')}</button>`;
      const quick=`<div class="dm-quickgrid"><button type="button" class="dm-quick" data-action="wifi" aria-pressed="${wifi}">${icon('wifi')}<span class="dm-label">Wi-Fi</span><span class="dm-small">${wifi?'Home':esc(t('Off'))}</span></button><button type="button" class="dm-quick" data-action="bluetooth" aria-pressed="${bluetooth}">${icon('bluetooth')}<span class="dm-label">Bluetooth</span><span class="dm-small">${esc(t(bluetooth?'On':'Off'))}</span></button></div><label for="dm-bright" class="dm-small">${esc(t('Brightness'))} <span id="dm-bright-value">${bright}%</span></label><input class="dm-slider" id="dm-bright" type="range" min="0" max="100" value="${bright}">`;
      let content;
      if(fault==='loading')content=body('Checking notifications…');
      else if(fault==='empty')content=notice('You’re all caught up.','There are no notifications to show.');
      else content=group(row('Files','Weekend itinerary.pdf · Download complete','go:files','folder-down'))+`<div class="dm-notice">${icon('messages-square')}<h3>Meadow</h3>${body(notificationTest?'Notification received':'Why are notifications missing?')}${b(notificationTest?'Notification settings':'Find out why','go:diagnosis','dm-textbutton','arrow-right')}</div>`;
      return header+quick+`<div class="dm-section">${esc(t('Notifications'))}</div>`+content+footer;
    }

      const palettes={citrine:['#d5ed69','#25320b','#e8f0cb','#354022'],iris:['#cfc2ff','#302149','#eae4f8','#393047'],glacier:['#acdff0','#163844','#ddedf2','#263d45']};const p=palettes[design.palette];root.style.setProperty('--dm-accent',`light-dark(${p[0]},${p[0]})`);root.style.setProperty('--dm-onaccent',`light-dark(${p[1]},${p[1]})`);root.style.setProperty('--dm-tonal',`light-dark(${p[2]},${p[3]})`);
      phone.dir=design.locale==='rtl'?'rtl':'ltr';phone.lang='en';
      if(previousScenario!==design.scenario){previousScenario=design.scenario;resetScenario()}else render();
    }
    const previewTheme=root.querySelector('.dm-preview-theme');
    if(!globalThis.Tweak){previewTheme.hidden=false;previewTheme.querySelector('select').addEventListener('change',e=>{design.appearance=e.target.value;applyDesign()})}
    applyDesign();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'character',{label:'Character',options:[{label:'Expressive',value:'expressive'},{label:'Quiet',value:'quiet'}]});tweak.addSelect(design,'palette',{label:'Palette',options:[{label:'Citrine',value:'citrine'},{label:'Iris',value:'iris'},{label:'Glacier',value:'glacier'}]});tweak.addSelect(design,'appearance',{label:'Appearance',options:[{label:'Follow system',value:'system'},{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});tweak.addToggle(design,'reduced',{label:'Reduce motion'});tweak.addSlider(design,'text',{label:'Text size',min:100,max:200,step:50,unit:'%'});tweak.addSelect(design,'locale',{label:'Language / layout stress',options:[{label:'English',value:'en'},{label:'German draft + English fallback',value:'de'},{label:'RTL layout / English strings',value:'rtl'}]});tweak.addSelect(design,'scenario',{label:'Journey scenario',options:[{label:'Normal',value:'normal'},{label:'Failure',value:'failure'},{label:'Unavailable',value:'unavailable'},{label:'Loading',value:'loading'},{label:'Empty',value:'empty'}]});}
  })();
  </script>
</div>
