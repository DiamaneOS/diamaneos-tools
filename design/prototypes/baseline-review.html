<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facet · baseline review</title>
<style>body{margin:0;font:15px system-ui;background:#f5f6f8;color:#24262a}header{padding:16px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}a{color:inherit}iframe{width:100%;height:calc(100vh - 58px);border:0}#error{padding:24px}</style></head>
<body><header><strong>Existing Facet baseline</strong><a href="facet-directions.html">Compare new directions</a><a href="diamaneos-ui.html">Open original</a><span>Review controls only · original study unchanged</span></header><p id="error" hidden></p><iframe title="Original Facet study with review controls"></iframe>
<script>
fetch('diamaneos-ui.html').then(r=>{if(!r.ok)throw Error('Could not load the original study.');return r.text()}).then(html=>{
  const base=new URL('.',location.href).href;
  const adapter=`<base href="${base}"><script src="review-controls.js"><\/script>`;
  document.querySelector('iframe').srcdoc=html.replace('<head>','<head>'+adapter);
}).catch(e=>{const p=document.querySelector('#error');p.hidden=false;p.textContent=e.message+' Open this review through a local HTTP server.';});
</script></body></html>
